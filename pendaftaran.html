<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Genius Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-6 px-8">
        <div class="container mx-auto flex justify-between items-center">
            <a href="bimbel4.html" class="text-2xl font-extrabold tracking-tight">
                <span class="text-blue-600">Genius</span><span>Academy</span>
            </a>
            <a href="bimbel4.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
                ← Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 flex-grow flex items-center justify-center">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Banner Top Portal -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 p-8 text-center text-white">
                <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
                    ✨
                </div>
                <h1 class="text-2xl font-extrabold">Buat Akun Baru</h1>
                <p class="text-blue-100 text-sm mt-1">Daftar untuk mengakses Portal Genius Academy</p>
            </div>

            <!-- Alert Notifikasi Error / Sukses -->
            <div id="alertMessage" class="hidden mx-6 mt-6 p-3.5 rounded-xl text-xs font-bold flex items-center gap-2">
                <span id="alertIcon">⚠️</span>
                <span id="alertText">Pesan notifikasi</span>
            </div>

            <!-- Form Daftar Akun -->
            <form id="registerForm" class="p-6 pt-6 space-y-4">
                
                <div>
                    <label for="nama" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Nama Lengkap
                    </label>
                    <input type="text" id="nama" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium" placeholder="Masukkan nama lengkap" required>
                </div>

                <div>
                    <label for="role" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Daftar Sebagai
                    </label>
                    <select id="role" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium bg-white" required>
                        <option value="siswa" selected>Siswa</option>
                        <option value="pengajar">Pengajar / Tentor</option>
                    </select>
                </div>

                <div>
                    <label for="identifier" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Username / NIS / Email
                    </label>
                    <input type="text" id="identifier" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium" placeholder="Contoh: siswa123 atau email@gmail.com" required>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium pr-10" placeholder="Minimal 6 karakter" minlength="6" required>
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
                            👁️
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Konfirmasi Kata Sandi
                    </label>
                    <input type="password" id="confirmPassword" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium" placeholder="Ulangi kata sandi" minlength="6" required>
                </div>

                <button type="submit" class="w-full py-3.5 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                    <span>Daftar Akun Sekarang</span>
                    <span>→</span>
                </button>

            </form>

            <!-- Link Login -->
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-500">
                Sudah punya akun? 
                <a href="login.html" class="text-blue-600 font-bold hover:underline">Masuk di sini</a>
            </div>

        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400">
        &copy; 2026 Genius Academy. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('registerForm');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const alertMessage = document.getElementById('alertMessage');
            const alertIcon = document.getElementById('alertIcon');
            const alertText = document.getElementById('alertText');

            function showAlert(message, type = 'error') {
                alertMessage.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-600', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-600');
                if (type === 'success') {
                    alertMessage.classList.add('bg-emerald-50', 'border', 'border-emerald-200', 'text-emerald-600');
                    alertIcon.innerText = '✅';
                } else {
                    alertMessage.classList.add('bg-red-50', 'border', 'border-red-200', 'text-red-600');
                    alertIcon.innerText = '⚠️';
                }
                alertText.innerText = message;
            }

            // Toggle Lihat/Sembunyikan Password
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                confirmPasswordInput.setAttribute('type', type);
            });

            // Handle Submit Form Daftar Akun
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const nama = document.getElementById('nama').value.trim();
                const role = document.getElementById('role').value;
                const identifier = document.getElementById('identifier').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                // Validasi kecocokan password
                if (password !== confirmPassword) {
                    showAlert('Konfirmasi kata sandi tidak cocok!');
                    return;
                }

                // Ambil data akun yang sudah ada di localStorage
                let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

                // Cek duplikasi identifier (termasuk akun default 'admin')
                const isDuplicate = registeredUsers.some(u => u.identifier.toLowerCase() === identifier.toLowerCase()) || identifier.toLowerCase() === 'admin';
                if (isDuplicate) {
                    showAlert('Username / NIS / Email sudah terdaftar! Gunakan identitas lain.');
                    return;
                }

                // Simpan akun baru
                const newUser = {
                    identifier: identifier,
                    password: password,
                    role: role,
                    nama: nama
                };

                registeredUsers.push(newUser);
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

                showAlert('Akun berhasil dibuat! Mengalihkan ke halaman login...', 'success');

                // Arahkan langsung ke halaman login setelah 1.2 detik
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            });
        });
    </script>

</body>
</html>
