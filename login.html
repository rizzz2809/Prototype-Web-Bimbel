<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | Genius Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-6 px-8">
        <div class="container mx-auto flex justify-between items-center">
            <a href="bimbel4.html" class="text-2xl font-extrabold tracking-tight">
                <span class="text-blue-600">Genius</span><span>Academy</span>
            </a>
            <a href="bimbel4.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
                ← Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 flex-grow flex items-center justify-center">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Banner Top Portal -->
            <div class="bg-gradient-to-r from-blue-600 to-blue-800 p-8 text-center text-white">
                <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
                    🎓
                </div>
                <h1 class="text-2xl font-extrabold">Portal Genius Academy</h1>
                <p class="text-blue-100 text-sm mt-1">Satu pintu masuk untuk Siswa, Pengajar & Admin</p>
            </div>

            <!-- Alert Notifikasi Error -->
            <div id="errorMessage" class="hidden mx-6 mt-6 p-3.5 bg-red-50 border border-red-200 text-red-600 rounded-xl text-xs font-bold flex items-center gap-2">
                <span>⚠️</span>
                <span id="errorText">Akun belum terdaftar</span>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="p-6 pt-6 space-y-5">
                
                <div>
                    <label for="identifier" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Username / NIS / Email
                    </label>
                    <input type="text" id="identifier" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium" placeholder="Masukkan Username, NIS, atau Email" required>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            Kata Sandi
                        </label>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none transition text-sm font-medium pr-10" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-600">
                        <span class="text-xs text-slate-600 font-medium">Ingat Saya di Perangkat Ini</span>
                    </label>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                    <span>Masuk Sekarang</span>
                    <span>→</span>
                </button>

            </form>

            <!-- Link Pendaftaran -->
            <div class="p-4 bg-slate-50 border-t border-slate-100 text-center text-xs text-slate-500">
                Belum punya akun? 
                <a href="pendaftaran.html" class="text-blue-600 font-bold hover:underline">Daftar di sini</a>
            </div>

        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400">
        &copy; 2026 Genius Academy. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const identifierInput = document.getElementById('identifier');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Akun Default Khusus Admin (Bisa ditambah akun demo pengajar/siswa jika perlu)
            const defaultAccounts = [
                { identifier: 'admin', password: '123', role: 'admin', nama: 'Administrator' }
            ];

            // Toggle Lihat/Sembunyikan Password
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });

            // Form Login Handler & Deteksi Otomatis Role
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const inputId = identifierInput.value.trim().toLowerCase();
                const inputPass = passwordInput.value;

                let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];
                const allUsers = [...registeredUsers, ...defaultAccounts];

                // Mencari kecocokan identifier (Username / NIS / Email) tanpa memfilter role di awal
                const userMatch = allUsers.find(u => 
                    (u.identifier && u.identifier.toLowerCase() === inputId) ||
                    (u.email && u.email.toLowerCase() === inputId) ||
                    (u.nis && u.nis.toLowerCase() === inputId) ||
                    (u.username && u.username.toLowerCase() === inputId)
                );

                if (!userMatch) {
                    errorText.innerText = 'Akun belum terdaftar! Silakan lakukan pendaftaran terlebih dahulu.';
                    errorMessage.classList.remove('hidden');
                    return;
                }

                if (userMatch.password !== inputPass) {
                    errorText.innerText = 'Kata sandi salah! Periksa kembali password Anda.';
                    errorMessage.classList.remove('hidden');
                    return;
                }

                /// Simpan User Aktif ke Sesi
                    localStorage.setItem('currentUser', JSON.stringify(userMatch));
                    errorMessage.classList.add('hidden');

                // REDIRECT KE HALAMAN AWAL (BERANDA)
                    window.location.href = 'bimbel4.html';

            });
        });
    </script>

</body>
</html>
